server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path without a matching file falls back
    # to index.html so React Router can handle it (/entrar, /convite/:token,
    # /meus-dados, etc. aren't real files on disk).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or manifest — the app relies on picking
    # up new versions promptly (vite-plugin-pwa's autoUpdate).
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
